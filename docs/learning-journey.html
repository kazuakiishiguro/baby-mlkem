<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ゼロから作る ML-KEM-768 — 読める実装から高速・小型実装まで">
  <title>ゼロから作る ML-KEM-768</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-soft: #eef3f7;
      --text: #17212b;
      --muted: #5d6b78;
      --line: #d9e0e7;
      --accent: #1769aa;
      --accent-soft: #e5f1fb;
      --code: #17202a;
      --code-text: #e9f2f9;
      --shadow: 0 12px 40px rgba(26, 43, 60, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
        "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.8;
    }

    .topbar {
      background: linear-gradient(135deg, #123a59, #1769aa);
      color: #fff;
      padding: 28px 24px 30px;
    }

    .topbar-inner {
      max-width: 1380px;
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #cfe8fb;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(1.55rem, 3vw, 2.3rem);
      line-height: 1.3;
    }

    .topbar p {
      max-width: 780px;
      margin: 10px 0 0;
      color: #e5f3fd;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(220px, 285px) minmax(0, 900px);
      gap: 32px;
      max-width: 1380px;
      margin: 28px auto 80px;
      padding: 0 24px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 18px;
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .sidebar-title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sidebar nav {
      display: grid;
      gap: 2px;
    }

    .sidebar a {
      color: var(--accent);
      text-decoration: none;
    }

    .sidebar a:hover {
      text-decoration: underline;
    }

    .toc-link {
      display: block;
      padding: 4px 8px;
      border-radius: 6px;
      line-height: 1.45;
      font-size: 0.9rem;
    }

    .toc-link.level-3 {
      padding-left: 22px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .raw-link {
      display: block;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 0.86rem;
    }

    article {
      min-width: 0;
      padding: 42px 54px 56px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    article h1,
    article h2,
    article h3 {
      scroll-margin-top: 20px;
      color: #123a59;
      line-height: 1.35;
    }

    article h1 {
      margin: 0 0 28px;
      padding-bottom: 18px;
      border-bottom: 2px solid var(--accent);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
    }

    article h2 {
      margin: 54px 0 18px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      font-size: 1.65rem;
    }

    article h3 {
      margin: 34px 0 12px;
      font-size: 1.2rem;
    }

    article p {
      margin: 0 0 18px;
    }

    article ul,
    article ol {
      margin: 0 0 20px;
      padding-left: 1.7rem;
    }

    article li + li {
      margin-top: 4px;
    }

    article a {
      color: var(--accent);
      overflow-wrap: anywhere;
    }

    article code {
      padding: 0.12em 0.38em;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: 4px;
      color: #173c5a;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
    }

    article pre {
      margin: 18px 0 24px;
      padding: 18px 20px;
      overflow-x: auto;
      background: var(--code);
      border-radius: 9px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    article pre code {
      padding: 0;
      background: transparent;
      border: 0;
      color: var(--code-text);
      font-size: 0.88rem;
      line-height: 1.65;
      white-space: pre;
    }

    article table {
      width: 100%;
      margin: 20px 0 26px;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    article th,
    article td {
      padding: 9px 12px;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    article th {
      background: var(--surface-soft);
      color: #123a59;
    }

    article hr {
      margin: 32px 0;
      border: 0;
      border-top: 1px solid var(--line);
    }

    .loading,
    .error {
      padding: 20px;
      background: var(--surface-soft);
      border-radius: 8px;
      color: var(--muted);
    }

    .error {
      color: #9b2c2c;
      background: #fff0f0;
    }

    .footer {
      max-width: 1380px;
      margin: -54px auto 32px;
      padding: 0 24px;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: right;
    }

    @media (max-width: 900px) {
      .layout {
        display: block;
        margin-top: 16px;
      }

      .sidebar {
        position: static;
        max-height: none;
        margin-bottom: 16px;
      }

      article {
        padding: 30px 24px 42px;
      }

      .footer {
        margin-top: -42px;
      }
    }

    @media (max-width: 560px) {
      .topbar {
        padding: 22px 16px 24px;
      }

      .layout {
        padding: 0 12px;
      }

      article {
        padding: 24px 18px 34px;
        border-radius: 10px;
      }

      article table {
        display: block;
        overflow-x: auto;
      }

      .footer {
        padding: 0 12px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="eyebrow">BABY-MLKEM / HANDS-ON BOOK</p>
      <h1>ゼロから作る ML-KEM-768</h1>
      <p>暗号初心者向けの通常剰余 scalar 実装から始め、正しさを保ちながら高速化、サイズ最小化、正式比較まで段階的に進む。</p>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar" aria-label="目次">
      <p class="sidebar-title">Contents</p>
      <nav id="toc">
        <span class="loading">目次を読み込み中...</span>
      </nav>
      <a class="raw-link" id="raw-link" href="implementation-book.md">Markdown 原文を開く</a>
    </aside>

    <article id="article">
      <div class="loading">学習ガイドを読み込み中...</div>
    </article>
  </main>

  <div class="footer">Generated from docs/implementation-book.md</div>

  <script>
    (function () {
      "use strict";

      var article = document.getElementById("article");
      var toc = document.getElementById("toc");
      var headingItems = [];
      var codeMark = String.fromCharCode(96);

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function replaceCodeSpans(value) {
        var output = "";
        var cursor = 0;
        var open = value.indexOf(codeMark);

        while (open >= 0) {
          var close = value.indexOf(codeMark, open + 1);
          if (close < 0) {
            break;
          }
          output += value.slice(cursor, open);
          output += "<code>" + value.slice(open + 1, close) + "</code>";
          cursor = close + 1;
          open = value.indexOf(codeMark, cursor);
        }

        return output + value.slice(cursor);
      }

      function inlineMarkdown(value) {
        var text = escapeHtml(value);
        text = replaceCodeSpans(text);
        text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, label, url) {
          var rawUrl = url.replace(/&amp;/g, "&");
          var safe = /^(https?:|\/|\.\/|\.\.\/|#)/i.test(rawUrl);
          return "<a href=\"" + (safe ? rawUrl : "#") + "\">" + label + "</a>";
        });
        text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        return text;
      }

      function splitTableRow(line) {
        var row = line.trim();
        if (row.charAt(0) === "|") {
          row = row.slice(1);
        }
        if (row.charAt(row.length - 1) === "|") {
          row = row.slice(0, -1);
        }
        return row.split("|").map(function (cell) {
          return cell.trim();
        });
      }

      function isTableSeparator(line) {
        var cells = splitTableRow(line);
        return cells.length > 0 && cells.every(function (cell) {
          return /^:?-{3,}:?$/.test(cell);
        });
      }

      function isSpecial(line) {
        return /^#{1,3}\s+/.test(line) ||
          /^[-*]\s+/.test(line) ||
          /^\d+\.\s+/.test(line) ||
          /^    /.test(line) ||
          /^---+\s*$/.test(line);
      }

      function renderTable(lines, start) {
        var header = splitTableRow(lines[start]);
        var index = start + 2;
        var rows = [];

        while (index < lines.length && lines[index].trim().charAt(0) === "|") {
          rows.push(splitTableRow(lines[index]));
          index += 1;
        }

        var html = "<table><thead><tr>";
        header.forEach(function (cell) {
          html += "<th>" + inlineMarkdown(cell) + "</th>";
        });
        html += "</tr></thead><tbody>";

        rows.forEach(function (row) {
          html += "<tr>";
          header.forEach(function (_, cellIndex) {
            html += "<td>" + inlineMarkdown(row[cellIndex] || "") + "</td>";
          });
          html += "</tr>";
        });

        return {
          html: html + "</tbody></table>",
          next: index
        };
      }

      function renderMarkdown(markdown) {
        var lines = markdown.replace(/\r\n?/g, "\n").split("\n");
        var html = [];
        var index = 0;
        headingItems = [];

        while (index < lines.length) {
          var line = lines[index];

          if (!line.trim()) {
            index += 1;
            continue;
          }

          var heading = line.match(/^(#{1,3})\s+(.+?)\s*$/);
          if (heading) {
            var level = heading[1].length;
            var id = "section-" + (headingItems.length + 1);
            var title = heading[2];
            headingItems.push({ id: id, level: level, title: title });
            html.push("<h" + level + " id=\"" + id + "\">" + inlineMarkdown(title) + "</h" + level + ">");
            index += 1;
            continue;
          }

          if (line.trim().charAt(0) === "|" &&
              index + 1 < lines.length &&
              isTableSeparator(lines[index + 1])) {
            var table = renderTable(lines, index);
            html.push(table.html);
            index = table.next;
            continue;
          }

          if (/^    /.test(line)) {
            var code = [];
            while (index < lines.length) {
              if (/^    /.test(lines[index])) {
                code.push(lines[index].slice(4));
                index += 1;
                continue;
              }
              if (!lines[index].trim() &&
                  index + 1 < lines.length &&
                  /^    /.test(lines[index + 1])) {
                code.push("");
                index += 1;
                continue;
              }
              break;
            }
            html.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
            continue;
          }

          if (/^[-*]\s+/.test(line)) {
            var unordered = [];
            while (index < lines.length && /^[-*]\s+/.test(lines[index])) {
              unordered.push("<li>" + inlineMarkdown(lines[index].replace(/^[-*]\s+/, "")) + "</li>");
              index += 1;
            }
            html.push("<ul>" + unordered.join("") + "</ul>");
            continue;
          }

          if (/^\d+\.\s+/.test(line)) {
            var ordered = [];
            while (index < lines.length && /^\d+\.\s+/.test(lines[index])) {
              ordered.push("<li>" + inlineMarkdown(lines[index].replace(/^\d+\.\s+/, "")) + "</li>");
              index += 1;
            }
            html.push("<ol>" + ordered.join("") + "</ol>");
            continue;
          }

          if (/^---+\s*$/.test(line)) {
            html.push("<hr>");
            index += 1;
            continue;
          }

          var paragraph = [];
          while (index < lines.length &&
                 lines[index].trim() &&
                 !isSpecial(lines[index]) &&
                 !(lines[index].trim().charAt(0) === "|" &&
                   index + 1 < lines.length &&
                   isTableSeparator(lines[index + 1]))) {
            paragraph.push(lines[index].trim());
            index += 1;
          }
          html.push("<p>" + inlineMarkdown(paragraph.join(" ")) + "</p>");
        }

        return html.join("\n");
      }

      function renderToc() {
        var links = headingItems
          .filter(function (item) {
            return item.id !== "section-1";
          })
          .map(function (item) {
            return "<a class=\"toc-link level-" + item.level + "\" href=\"#" +
              item.id + "\">" + inlineMarkdown(item.title) + "</a>";
          });
        toc.innerHTML = links.join("");
      }

      fetch("implementation-book.md", { cache: "no-cache" })
        .then(function (response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          return response.text();
        })
        .then(function (markdown) {
          article.innerHTML = renderMarkdown(markdown);
          renderToc();
        })
        .catch(function (error) {
          article.innerHTML =
            "<div class=\"error\">学習ガイドを読み込めませんでした。"
            + "この HTML は HTTP サーバー経由で開いてください。"
            + "<br><small>" + escapeHtml(error.message) + "</small></div>";
          toc.innerHTML = "";
        });
    }());
  </script>
</body>
</html>
